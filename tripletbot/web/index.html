<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TripleTBot Arcade · live preview</title>
<style>
  :root{
    --bg:#0b0d13; --panel:#141820; --panel2:#1b202b; --line:#2a3140;
    --text:#e9eef8; --muted:#94a0b6; --dim:#68758e;
    --accent:#7c5cff; --accent2:#22d3ee; --green:#34d399; --red:#f87171; --gold:#ffc754;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#11141c,#0a0c11 40%)}
  header.top{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;position:sticky;top:0;z-index:5;
    background:rgba(11,13,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#0c0f15;
    background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:15px}
  .brand .t{font-weight:800;font-size:15px;letter-spacing:.2px}
  .brand .s{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
  header .grow{flex:1}
  .ghost{background:#1d2330;color:var(--text);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:13px;font-weight:700}
  .picker{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .picker::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:#161b25;color:var(--muted);
    padding:8px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
  .chip.on{color:#0c0f15;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .bar select{background:#161b25;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;font-weight:700}
  .bar .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:800}
  main.chat{flex:1;padding:14px 12px 8px;overflow-y:auto}
  .msg{display:flex;gap:10px}
  .avatar{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:grid;place-items:center;
    background:linear-gradient(135deg,#2b2350,#123b45);border:2px solid #3a4460;font-size:12px;font-weight:900;color:#cfd8ea}
  .body{flex:1;min-width:0}
  .meta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .bot-name{font-weight:800;font-size:14px;color:#cfd8ea}
  .tag{background:var(--accent);color:#fff;font-size:9.5px;font-weight:900;padding:2px 5px;border-radius:4px;letter-spacing:.4px}
  .time{font-size:11px;color:var(--dim)}
  .embed{background:var(--panel);border-left:4px solid var(--accent);border-radius:6px;padding:10px;max-width:100%}
  .embed-title{font-weight:800;font-size:14.5px;margin-bottom:2px}
  .embed-desc{font-size:13px;color:var(--muted);margin-bottom:8px;min-height:18px}
  .frame{width:100%;border-radius:10px;display:block;background:#0d1017;border:1px solid #232a38}
  .scores{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .pill{font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:999px;background:#1d2330;color:var(--muted);
    border:1px solid var(--line);display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%}
  .controls{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;gap:6px}
  .btn{flex:1;min-height:42px;border:0;border-radius:9px;font-size:13.5px;font-weight:800;color:#fff;
    background:#4e5566;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;line-height:1.1}
  .btn.primary{background:#5865f2}.btn.success{background:#248046}.btn.danger{background:#da373c}
  .btn:disabled{opacity:.45}
  .btn:active{transform:scale(.985)}
  .sel{width:100%;min-height:42px;border-radius:9px;background:#1d2330;color:var(--text);
    border:1px solid var(--line);font-size:13.5px;font-weight:700;padding:8px 10px}
  .composer{display:none;gap:8px;padding:10px 12px 16px;border-top:1px solid var(--line);background:rgba(11,13,19,.96)}
  .composer.on{display:flex}
  .composer input{flex:1;background:#1a1f2a;border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:12px;font-size:15px;min-width:0}
  .composer button{background:linear-gradient(135deg,var(--accent),#5865f2);color:#fff;border:0;border-radius:10px;
    padding:0 16px;font-weight:800;font-size:14px}
  .foot{padding:0 14px 16px;font-size:11.5px;color:var(--dim);line-height:1.5}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#202634;border:1px solid var(--line);
    color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;max-width:90%}
  .toast.on{opacity:1}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid #3a4460;border-top-color:var(--accent2);
    border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">TT</div>
    <div class="brand">
      <div class="t">TripleTBot Arcade</div>
      <div class="s" id="subtitle">live board preview</div>
    </div>
    <div class="grow"></div>
    <button class="ghost" id="watchBtn">AI vs AI</button>
  </header>

  <div class="picker" id="picker"></div>

  <div class="bar">
    <span class="lbl">Rounds</span>
    <select id="rounds">
      <option>1</option><option selected>3</option><option>5</option>
    </select>
    <span class="lbl">Engine</span>
    <select id="difficulty">
      <option value="1">Easy</option><option value="2" selected>Normal</option>
      <option value="3">Hard</option><option value="4">Insane</option>
    </select>
    <div class="grow"></div>
    <span class="lbl" id="stateLbl"><span class="spinner"></span></span>
  </div>

  <main class="chat">
    <div class="msg">
      <div class="avatar">TT</div>
      <div class="body">
        <div class="meta">
          <span class="bot-name">TripleTBot</span>
          <span class="tag">APP</span>
          <span class="time" id="clock">today</span>
        </div>
        <div class="embed">
          <div class="embed-title" id="title">Loading the arcade…</div>
          <div class="embed-desc" id="desc"></div>
          <img class="frame" id="frame" alt="match board">
          <div class="scores" id="scores"></div>
        </div>
        <div class="controls" id="controls"></div>
      </div>
    </div>
  </main>

  <form class="composer" id="composer">
    <input id="input" placeholder="type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit">Send</button>
  </form>
  <div class="foot">
    This is the same engine and the same frames the Discord bot posts — tap the buttons exactly like you would in the channel.
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let state = null, matchId = null, gameKey = "xox", mode = "solo", busy = false;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2200);
}

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadGames(){
  const games = await (await fetch("/api/games")).json();
  const picker = $("picker");
  picker.innerHTML = "";
  games.forEach(g=>{
    const b = document.createElement("button");
    b.className = "chip" + (g.key === gameKey ? " on" : "");
    b.textContent = g.name;
    b.onclick = () => { gameKey = g.key; document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
                        b.classList.add("on"); $("subtitle").textContent = g.tagline; start(g.key, mode); };
    picker.appendChild(b);
  });
  const first = games.find(g=>g.key===gameKey) || games[0];
  if(first) $("subtitle").textContent = first.tagline;
}

async function start(key, m){
  gameKey = key; mode = m || mode;
  const q = new URLSearchParams({game:key, mode, rounds:$("rounds").value, difficulty:$("difficulty").value});
  const s = await api("/api/new?" + q.toString());
  matchId = s.id; state = s; render(s);
}

async function refresh(){
  if(!matchId) return;
  try{
    const s = await api("/api/state?id=" + matchId);
    state = s; render(s);
  }catch(e){ /* keep the last frame */ }
}

function tone(style){
  return {primary:"btn primary", success:"btn success", danger:"btn danger"}[style] || "btn";
}

function render(s){
  $("title").textContent = s.title;
  $("desc").textContent = s.status || "";
  const img = $("frame");
  if(img.dataset.v !== s.image){ img.src = s.image; img.dataset.v = s.image; }
  $("scores").innerHTML = "";
  (s.scores||[]).forEach(p=>{
    const el = document.createElement("div");
    el.className = "pill";
    el.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name} · ${p.score}`;
    $("scores").appendChild(el);
  });

  const controls = $("controls");
  controls.innerHTML = "";
  const rows = {};
  (s.buttons||[]).forEach(b=>{ (rows[b.row] = rows[b.row] || []).push(b); });
  Object.keys(rows).sort((a,b)=>a-b).forEach(r=>{
    const row = document.createElement("div"); row.className = "row";
    rows[r].forEach(b=>{
      const btn = document.createElement("button");
      btn.className = tone(b.style);
      btn.disabled = !!b.disabled;
      btn.innerHTML = (b.emoji ? b.emoji + " " : "") + (b.label || "");
      btn.onclick = () => act(b.id);
      row.appendChild(btn);
    });
    controls.appendChild(row);
  });
  (s.selects||[]).forEach(sel=>{
    const wrap = document.createElement("div"); wrap.className = "row";
    const el = document.createElement("select");
    el.className = "sel"; el.disabled = !!sel.disabled;
    const ph = document.createElement("option");
    ph.textContent = sel.placeholder; ph.value = ""; ph.selected = true; ph.disabled = true;
    el.appendChild(ph);
    sel.options.forEach(o=>{
      const op = document.createElement("option");
      op.value = o.id; op.textContent = (o.emoji ? o.emoji + " " : "") + o.label;
      el.appendChild(op);
    });
    el.onchange = () => { if(el.value) act(el.value); };
    wrap.appendChild(el); controls.appendChild(wrap);
  });

  const composer = $("composer");
  if(s.modal && !s.modal.disabled){
    composer.classList.add("on");
    $("input").placeholder = s.modal.placeholder || s.modal.label || "type…";
    $("input").maxLength = s.modal.max_length || 60;
  } else {
    composer.classList.remove("on");
  }
  $("stateLbl").textContent = s.finished ? "match over" : (s.settled ? "round over" : (s.modal || (s.buttons||[]).length ? "your move" : "watching"));
  $("clock").textContent = "round " + s.round + "/" + s.rounds;
}

async function act(action){
  if(!matchId || busy) return;
  busy = true;
  try{
    const s = await api("/api/act", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id: matchId, action})});
    if(s.error){ toast(s.error); }
    else { state = s; render(s); }
    if(!s.error) { $("input").value = ""; }
  }catch(e){ toast("That move did not go through."); }
  busy = false;
}

$("composer").addEventListener("submit", (ev)=>{
  ev.preventDefault();
  const v = $("input").value.trim();
  if(!v || !state || !state.modal) return;
  act(state.modal.id + v);
});
$("watchBtn").onclick = () => { start(gameKey, "watch"); };
$("rounds").onchange = () => start(gameKey, mode);
$("difficulty").onchange = () => start(gameKey, mode);

(async function boot(){
  await loadGames();
  await start("xox", "solo");
  setInterval(refresh, 900);
})();
</script>
</body>
</html>
